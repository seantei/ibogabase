name: sync-ll-html-from-json
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync Listening Library HTML from JSON
        run: python3 scripts/sync_ll_html_from_json.py
      - name: Commit and push if changed
        run: |
          set -euo pipefail
          git config user.name seantei
          git config user.email 144167926+seantei@users.noreply.github.com
          git add media/listening-library/index.html
          if git diff --cached --quiet; then
            echo "No HTML changes"
          else
            git commit -m "Listening Library HTML: sync stamp/chips from verified JSON (51 live OK / 1 dead flagged)"
            git push
          fi
